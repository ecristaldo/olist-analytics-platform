name: dbt CI            # ← the name of the workflow (shown in the Actions tab)

on:
  pull_request:
    branches: [main]

jobs:
  dbt-build:                  # ← this is the name of the JOB, the one you add as a required check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: olist_dbt     # ← the directory where the dbt project is located
    env:
      GCP_PROJECT_ID: olist-analytics-eduardo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"

      - name: Install pinned dependencies
        run: pip install -r ../requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - run: dbt deps
      - run: dbt build --profiles-dir ci --target ci