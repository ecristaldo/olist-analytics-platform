olist_dbt:                 # must match `profile:` in dbt_project.yml
  target: ci
  outputs:
    ci:
      type: bigquery
      method: oauth        # the same as your laptop: it uses ADC
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: dbt_ci      # its own dataset, never dbt_dev
      location: europe-west2
      threads: 4
      job_execution_timeout_seconds: 300