version: 2

models:
  - name: stg_olist__orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

  - name: stg_olist__customers
    description: One row per customer_id. In Olist, customer_id is created per order; customer_uid identifies the person.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_olist__order_items
    description: One row per item in an order.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id

  - name: stg_olist__order_payments
    description: One row per payment of an order.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id

  - name: stg_olist__products
    description: One row per product.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: stg_olist__sellers
    description: One row per seller.
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: stg_olist__product_category_name_translation
    description: One row per Portuguese product category name, with its English name.
    columns:
      - name: product_category_name
        data_tests:
          - unique
          - not_null
